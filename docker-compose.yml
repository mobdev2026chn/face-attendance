version: '3.8'

services:
  # 1. Relational database storage (PostgreSQL)
  postgres_db:
    image: postgres:15-alpine
    container_name: faceattend_postgres
    restart: always
    environment:
      POSTGRES_USER: faceattend_admin
      POSTGRES_PASSWORD: FaceAttendSecurePassword2026!
      POSTGRES_DB: faceattend_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceattend_admin -d faceattend_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI REST backend service
  api_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faceattend_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://faceattend_admin:FaceAttendSecurePassword2026!@postgres_db:5432/faceattend_db
      - JWT_SECRET=prod_super_secret_jwt_key_2026_faceattend_change_me
      - FACE_ENCRYPTION_KEY=vKjG9N_hSgV5dGk9P9j2Jb3wX5z7r8t9W2y1V8z4n3s=
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # 3. React Vite production web client
  web_client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faceattend_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api_backend

volumes:
  postgres_data:
